# config.yaml 로 복사해서 사용하세요:  cp config.example.yaml config.yaml
store:
  name: "OO치킨 강남점"
  signature: "- OO치킨 사장 드림"
  tone: "재치 있고 유쾌한 존댓말. 리뷰 내용(메뉴, 맛 표현 등)을 살린 말장난이나 센스 있는 한마디를 넣어 읽는 사람이 피식 웃게"
  extra_instructions: "재주문 고객에게는 다시 찾아주셔서 감사하다는 말을 넣어주세요."

reply:
  min_rating_to_auto_reply: 3   # 1~2점 리뷰는 자동 등록하지 않고 건너뜀
  max_length: 300
  use_ai: true                  # false면 템플릿 답글
  api_key: ""                   # 여기에 Gemini API 키를 붙여넣으세요 (https://aistudio.google.com/apikey)
  model: gemini-flash-latest    # 무료 한도에 자주 걸리면 gemini-flash-lite-latest (한도가 더 넉넉함)
  min_interval_sec: 7           # Gemini 호출 사이 최소 간격(초). 무료 등급 분당 한도 보호용

run:
  dry_run: true                 # 처음엔 true로 답글 품질을 확인한 뒤 false 또는 --post
  max_pages: 0                  # 0이면 끝까지
  max_replies_per_run: 0        # 0이면 제한 없음
  delay_between_replies_sec: 3
  interval_minutes: 0           # 예: 60 → 1시간마다 반복 실행
  headless: false               # 쿠팡이츠 차단을 피하려면 false 권장

# 리뷰 찾기는 기본적으로 자동입니다 ('댓글 등록' 버튼 글자로 찾고, Gemini가 카드를 읽음).
# 버튼 글자가 다르면 아래를 바꾸세요.
# site:
#   reply_button_text: "^(사장님\\s*)?(댓글|답글)\\s*(등록|작성|달기|쓰기)"
