# config.yaml 로 복사해서 사용하세요:  cp config.example.yaml config.yaml
store:
  name: "OO치킨 강남점"
  signature: "- OO치킨 사장 드림"
  tone: "따뜻하고 정중한 존댓말, 친근하게"
  extra_instructions: "재주문 고객에게는 다시 찾아주셔서 감사하다는 말을 넣어주세요."

reply:
  min_rating_to_auto_reply: 3   # 1~2점 리뷰는 자동 등록하지 않고 건너뜀
  max_length: 300
  use_claude: true              # ANTHROPIC_API_KEY 필요. false면 템플릿 답글
  model: claude-opus-5-5
  effort: low

run:
  dry_run: true                 # 처음엔 true로 답글 품질을 확인한 뒤 false 또는 --post
  max_pages: 3
  max_replies_per_run: 20
  delay_between_replies_sec: 3
  interval_minutes: 0           # 예: 60 → 1시간마다 반복 실행
  headless: true

# 사장님 사이트 화면 구조에 맞게 셀렉터를 조정해야 할 수 있습니다.
# 기본값은 coupang_review/config.py 의 DEFAULTS 참고. 필요한 항목만 덮어쓰면 됩니다.
